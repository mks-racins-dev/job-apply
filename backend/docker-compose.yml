services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jobmagnet
      POSTGRES_USER: jobmagnet
      POSTGRES_PASSWORD: jobmagnet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmagnet"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/JobMagnet.Api/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=jobmagnet;Username=jobmagnet;Password=jobmagnet
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (32+ chars)}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/JobMagnet.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=jobmagnet;Username=jobmagnet;Password=jobmagnet
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/JobMagnet.Web/Dockerfile
    environment:
      Api__BaseUrl: http://api:8080/
      DataProtection__KeysPath: /keys
    ports:
      - "8081:8080"
    volumes:
      - webkeys:/keys
    depends_on:
      api:
        condition: service_started

volumes:
  webkeys:
  pgdata:
